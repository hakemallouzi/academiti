[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Next.js OpenNext adapter is auto-applied by Netlify.
# Required env vars (set in Netlify UI/CLI):
#   DATABASE_URL, AUTH_SECRET, NEXTAUTH_URL, NEXT_PUBLIC_APP_URL
#   AUTH_TRUST_HOST=true, DEV_BYPASS_PAYMENTS=true (until Stripe is live)
